# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx6g
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# LiteRT 2.1.6 ships two AARs (litert + litert-api) that both declare the
# namespace `com.google.ai.edge.litert`; AGP 9's unique-namespace validation
# rejects that (google-ai-edge/LiteRT issue #8474). This transitional flag
# keeps the legacy permissive merge until upstream fixes the manifests.
android.uniquePackageNames=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Tell the KMP plugin where the iOS project lives
xcodeproj=./ios
org.gradle.caching=true
org.gradle.parallel=true
kotlin.native.disableCompilerDaemon=true #TODO revert?
# KMP target knobs for the convention plugins. Gradle ignores subproject
# gradle.properties files, so per-module overrides live here, scoped by module
# name; a bare `photorate.jvm` / `photorate.iosX64` would apply to every module.
# imageRecognitionComponentApi: JVM target (host tests / JVM consumers).
photorate.imageRecognitionComponentApi.jvm=true
# imageRecognitionComponentLiteRt: JVM target (kmplitert-core-jvm smoke tests) and
# no iosX64 (kmplitert-core publishes no iosX64 klib, only arm64 device +
# simulator). The module's build script references jvmMain/iosArm64Main, so both
# keys must follow any future rename of the module.
photorate.imageRecognitionComponentLiteRt.jvm=true
photorate.imageRecognitionComponentLiteRt.iosX64=false

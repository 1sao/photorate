[versions]
## SDK Versions
# 30 (Android 11) is the first API level whose bundled SQLite (3.28.0) supports
# UPSERT (INSERT ... ON CONFLICT ... DO UPDATE, needs SQLite >= 3.24.0).
minSdk = "29" #TODO temporarily lowered for testing
targetSdk = "37"
compileSdk = "37"
jvmToolchain = "11"

# Dependencies
arrow = "2.2.3"
kotlin = "2.4.0"
android-gradle-plugin = "9.2.1"
ktfmt-gradle = "0.27.0"
compose = "1.11.4"
compose-multiplatform = "1.11.1"
compose-material3 = "1.5.0-alpha24"
material-icons = "1.6.0"
android-desugaring = "2.1.5"
androidx-core = "1.19.0"
androidx-test-junit = "1.3.0"
androidx-activity-compose = "1.13.0"
androidx-lifecycle = "2.11.0"
coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
robolectric = "4.16.1"
kermit = "2.1.0"
skie = "0.10.13"
koin = "4.2.2"
koin-plugin = "1.0.2"
onnxruntime = "1.28.0"
kotlinx-serialization = "1.11.0"
turbine = "1.2.1"
sqlDelight = "2.3.2"
kotlinStdlib = "2.4.0"
runner = "1.7.0"
core = "1.7.0"
junit = "1.3.0"
androidx-viewmodel = "2.10.0"
work = "2.11.2"
accompanist = "0.37.3"
coil = "3.5.0"
litert = "2.1.6"
javax-inject = "1"
kmplitert = "0.1.4"
mediapipe = "0.10.35"
firebase-bom = "34.17.0"
tensorflow = "2.17.0"
material3Adaptive = "1.0.0-alpha06"

[libraries]
android-desugaring = { module = "com.android.tools:desugar_jdk_libs", version.ref = "android-desugaring" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-test-junit = { module = "androidx.test.ext:junit-ktx", version.ref = "androidx-test-junit" }

compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-material = { module = "androidx.compose.material:material", version.ref = "compose" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "material-icons" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
compose-material3-window-size = { module = "androidx.compose.material3:material3-window-size-class", version.ref = "compose-material3" }
compose-material3-adaptive-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite", version.ref = "compose-material3" }
compose-animation = { module = "androidx.compose.animation:animation", version.ref = "compose" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }

coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-annotations = { module = "io.insert-koin:koin-annotations", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
koin-viewmodel = { module = "io.insert-koin:koin-core-viewmodel", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
